# Broker interno. No se publica ningún puerto hacia el host ni hacia Internet,
# por lo que solo los contenedores de la red interna de Docker pueden conectarse.
listener 1883
allow_anonymous true

# Persistencia: los mensajes QoS 1 pendientes sobreviven a un reinicio del broker
persistence true
persistence_location /mosquitto/data/

# Publica $SYS cada 5 s (lo usa el healthcheck)
sys_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
